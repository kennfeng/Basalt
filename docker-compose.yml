services:
  ollama:
    image: ollama/ollama:0.6.2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server_pid=$$!
        model=$${ATLAS_LLM_MODEL:-llama3.2:1b}
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama show "$$model" >/dev/null 2>&1 || ollama pull "$$model"
        wait "$$server_pid"
    environment:
      ATLAS_LLM_MODEL: ${ATLAS_LLM_MODEL:-llama3.2:1b}
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$${ATLAS_LLM_MODEL:-llama3.2:1b}\" > /dev/null 2>&1"]
      interval: 30s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    networks: [internal]
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  atlas-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ATLAS_DB_PATH: ${ATLAS_DB_PATH:-/data/atlas_db}
      ATLAS_PROVIDER: ${ATLAS_PROVIDER:-ollama}
      ATLAS_LLM_MODEL: ${ATLAS_LLM_MODEL:-llama3.2:1b}
      ATLAS_RERANKER_MODEL: ${ATLAS_RERANKER_MODEL:-BAAI/bge-reranker-base}
      ATLAS_OLLAMA_BASE_URL: ${ATLAS_OLLAMA_BASE_URL:-http://ollama:11434}
      ATLAS_N_RESULTS: ${ATLAS_N_RESULTS:-10}
      ATLAS_TOP_N: ${ATLAS_TOP_N:-3}
      HF_HOME: /data/hf-cache
    volumes:
      - atlas_db:/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    networks: [internal, edge]
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  internal: {}
  edge: {}

volumes:
  atlas_db: {}
  ollama_models: {}
