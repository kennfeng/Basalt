services:
  ollama:
    image: ollama/ollama:0.6.2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server_pid=$$!
        model=$${BASALT_LLM_MODEL:-llama3.2:1b}
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama show "$$model" >/dev/null 2>&1 || ollama pull "$$model"
        wait "$$server_pid"
    environment:
      BASALT_LLM_MODEL: ${BASALT_LLM_MODEL:-llama3.2:1b}
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$${BASALT_LLM_MODEL:-llama3.2:1b}\" > /dev/null 2>&1"]
      interval: 30s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    networks: [internal]
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  basalt-api:
    build: .
    ports:
      - "8001:8000"
    environment:
      BASALT_DB_PATH: ${BASALT_DB_PATH:-/data/basalt_db}
      BASALT_PROVIDER: ${BASALT_PROVIDER:-ollama}
      BASALT_LLM_MODEL: ${BASALT_LLM_MODEL:-llama3.2:1b}
      BASALT_RERANKER_MODEL: ${BASALT_RERANKER_MODEL:-BAAI/bge-reranker-base}
      BASALT_BASE_URL: ${BASALT_BASE_URL:-http://ollama:11434}
      BASALT_N_RESULTS: ${BASALT_N_RESULTS:-10}
      BASALT_TOP_N: ${BASALT_TOP_N:-3}
      BASALT_BATCH_SIZE: ${BASALT_BATCH_SIZE:-512}
      BASALT_HNSW_M: ${BASALT_HNSW_M:-16}
      BASALT_HNSW_CONSTRUCTION_EF: ${BASALT_HNSW_CONSTRUCTION_EF:-200}
      BASALT_HNSW_SEARCH_EF: ${BASALT_HNSW_SEARCH_EF:-10}
      BASALT_AUTO_SEED: ${BASALT_AUTO_SEED:-true}
      BASALT_HYBRID: ${BASALT_HYBRID:-true}
      BASALT_HYBRID_DENSE_N: ${BASALT_HYBRID_DENSE_N:-50}
      BASALT_HYBRID_SPARSE_N: ${BASALT_HYBRID_SPARSE_N:-50}
      BASALT_HYBRID_RRF_K: ${BASALT_HYBRID_RRF_K:-60}
      BASALT_HYBRID_TOP_N: ${BASALT_HYBRID_TOP_N:-20}
      BASALT_RERANKER_DEVICE: ${BASALT_RERANKER_DEVICE:-cpu}
      BASALT_RERANKER_BATCH_SIZE: ${BASALT_RERANKER_BATCH_SIZE:-32}
      BASALT_MAX_CONCURRENCY: ${BASALT_MAX_CONCURRENCY:-4}
      BASALT_ASK_TIMEOUT: ${BASALT_ASK_TIMEOUT:-30}
      BASALT_API_KEY: ${BASALT_API_KEY:-}
      HF_HOME: /data/hf-cache
    volumes:
      - basalt_db:/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    networks: [internal]
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  internal: {}

volumes:
  basalt_db: {}
  ollama_models: {}
