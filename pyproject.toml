[project]
name = "basalt-rag"
version = "0.1.0"
description = "Basalt: hybrid BM25+dense retrieval, cross-encoder re-ranking, Ollama/Gemini generation"
requires-python = ">=3.11"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "eval/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
