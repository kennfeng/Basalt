[project]
name = "basalt-rag"
version = "0.1.0"
description = "Basalt: hybrid BM25+dense retrieval, cross-encoder re-ranking, Ollama/Gemini generation"
requires-python = ">=3.10"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 88

# TEMP: enforce no-comments style — ERA001 flags commented-out code as proxy.
# Remove this block when lifting the no-comments rule.
[tool.ruff.lint]
select = ["E", "F", "ERA"]
ignore = []

[tool.ruff.lint.flake8-eradicate]
aggressive = true

[tool.pytest.ini_options]
testpaths = ["tests"]
